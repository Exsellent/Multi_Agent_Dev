<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Multi-agent-devops-assistant</title>
    <style>
        :root {
            --primary-yellow: #FFD700;
            --primary-gold: #FFA500;
            --primary-black: #1A1A1A;
            --accent-yellow: #FFEB3B;
            --bg-dark: #0D0D0D;
            --surface: #1A1A1A;
            --text-main: #FFFFFF;
            --text-dim: #B0B0B0;
            --border: #333333;
            --input-bg: #252525;
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;
        }

        [data-theme="light"] {
            --bg-dark: #F5F5F5;
            --surface: #FFFFFF;
            --text-main: #1A1A1A;
            --text-dim: #666666;
            --border: #DDDDDD;
            --input-bg: #F9F9F9;
        }

        * {
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #000000 100%);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        [data-theme="light"] body {
            background: linear-gradient(135deg, #F5F5F5 0%, #E0E0E0 100%);
        }

        .header {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.1));
            border-radius: 16px;
            border: 2px solid var(--primary-gold);
            margin-bottom: 20px;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-yellow), var(--primary-gold), var(--primary-yellow), var(--accent-yellow));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientFlow 4s ease infinite;
        }

        @keyframes gradientFlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .theme-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .switch {
            position: relative;
            width: 48px;
            height: 24px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background-color: #555;
            border-radius: 24px;
            cursor: pointer;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            left: 4px;
            top: 4px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        input:checked + .slider {
            background: linear-gradient(90deg, var(--primary-gold), var(--primary-yellow));
        }

        input:checked + .slider::before {
            transform: translateX(24px);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: linear-gradient(135deg, var(--surface) 0%, rgba(26, 26, 26, 0.95) 100%);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
        }

        [data-theme="light"] .panel {
            background: var(--surface);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .panel:hover {
            box-shadow: 0 12px 48px rgba(255, 165, 0, 0.3);
            border-color: var(--primary-gold);
        }

        .panel-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(90deg, var(--primary-yellow), var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .label {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-weight: 500;
        }

        textarea, select {
            width: 100%;
            background-color: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.2);
        }

        select {
            cursor: pointer;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            color: var(--primary-black);
            background: linear-gradient(135deg, var(--accent-yellow), var(--primary-gold));
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 165, 0, 0.6);
            background: linear-gradient(135deg, var(--primary-yellow), var(--primary-gold), var(--accent-yellow));
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .agent-card {
            background: linear-gradient(135deg, var(--input-bg), rgba(37, 37, 37, 0.8));
            border: 2px solid var(--primary-gold);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        [data-theme="light"] .agent-card {
            background: linear-gradient(135deg, var(--input-bg), rgba(249, 249, 249, 0.8));
        }

        .agent-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-yellow), var(--primary-gold));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .agent-card:hover {
            border-color: var(--accent-yellow);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
        }

        .agent-card:hover::before {
            transform: scaleX(1);
        }

        .agent-card.active {
            border-color: var(--primary-yellow);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 165, 0, 0.1));
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .agent-card.working {
            animation: pulse 2s ease-in-out infinite;
            border-color: var(--primary-gold);
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7);
                border-color: var(--primary-gold);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(255, 215, 0, 0);
                border-color: var(--accent-yellow);
            }
        }

        .agent-status {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--text-dim);
        }

        .agent-status.success { 
            background-color: var(--success); 
            box-shadow: 0 0 8px var(--success);
        }
        .agent-status.working { 
            background-color: var(--primary-yellow); 
            animation: blink 1s ease infinite;
            box-shadow: 0 0 8px var(--primary-yellow);
        }
        .agent-status.error { 
            background-color: var(--error);
            box-shadow: 0 0 8px var(--error);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .agent-icon {
            font-size: 28px;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(255, 215, 0, 0.3));
        }

        .agent-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .agent-port {
            font-size: 12px;
            color: var(--primary-gold);
            margin-top: 4px;
            font-weight: 700;
        }

        .output-container {
            margin-top: 16px;
            max-height: 400px;
            overflow-y: auto;
        }

        .output-container::-webkit-scrollbar {
            width: 8px;
        }

        .output-container::-webkit-scrollbar-track {
            background: var(--input-bg);
            border-radius: 4px;
        }

        .output-container::-webkit-scrollbar-thumb {
            background: var(--primary-gold);
            border-radius: 4px;
        }

        .log-entry {
            padding: 10px 14px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--input-bg), rgba(37, 37, 37, 0.6));
            border-left: 4px solid var(--primary-gold);
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            animation: slideIn 0.3s ease;
        }

        [data-theme="light"] .log-entry {
            background: linear-gradient(90deg, var(--input-bg), rgba(249, 249, 249, 0.6));
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-entry.success {
            border-left-color: var(--success);
            background: linear-gradient(90deg, rgba(76, 175, 80, 0.1), transparent);
        }

        .log-entry.error {
            border-left-color: var(--error);
            background: linear-gradient(90deg, rgba(244, 67, 54, 0.1), transparent);
        }

        .result-card {
            background: linear-gradient(135deg, var(--input-bg), rgba(37, 37, 37, 0.9));
            border: 2px solid var(--primary-gold);
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            box-shadow: 0 4px 16px rgba(255, 165, 0, 0.2);
        }

        [data-theme="light"] .result-card {
            background: var(--input-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .result-card h4 {
            margin: 0 0 8px 0;
            background: linear-gradient(90deg, var(--accent-yellow), var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 16px;
            font-weight: 700;
        }

        .result-card pre {
            margin: 0;
            font-size: 12px;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-wrap: break-word;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid var(--primary-gold);
        }

        [data-theme="light"] .result-card pre {
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-main);
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--primary-yellow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .cors-warning {
            background-color: rgba(255, 152, 0, 0.1);
            border: 1px solid var(--warning);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-size: 12px;
        }

        .cors-warning strong {
            color: var(--warning);
        }
    </style>
</head>
<body>
<div class="header">
    <div class="title">🤖 Multi-agent-devops-assistant </div>
    <div class="theme-switch">
        <span id="themeLabel">Dark</span>
        <label class="switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
        </label>
    </div>
</div>

<div class="container">
    <!-- Input Panel -->
    <div class="panel">
        <div class="panel-title">📝 Task Input</div>

        <div class="label">Select Agent</div>
        <select id="agentSelect">
            <option value="planner">Planner - Task Decomposition</option>
            <option value="risks">Risks - Security Analysis</option>
            <option value="progress">Progress - Velocity Tracking</option>
            <option value="digest">Digest - Report Generation</option>
            <option value="image">Image - Architecture Analysis</option>
            <option value="health">Health Monitor - System Status</option>
            <option value="metrics">Metrics - Performance Data</option>
        </select>

        <div class="label">Task Description</div>
        <textarea id="taskInput" placeholder="Example: Implement OAuth2 authentication with JWT tokens"></textarea>

        <button onclick="executeAgent()" id="executeBtn">
            ⚡ Execute Agent
        </button>

        <div class="panel-title" style="margin-top: 24px;">📌 Agent Status</div>
        <div class="agents-grid" id="agentsGrid"></div>
    </div>

    <!-- Output Panel -->
    <div class="panel">
        <div class="panel-title">📊 Execution Results</div>
        <div class="output-container" id="outputContainer">
            <div class="log-entry">
                💡 Select an agent and provide input to start
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const API_BASE = 'http://localhost';

    const agents = [
        {id: 'planner', name: 'Planner', port: 8201, icon: '📋', method: 'tools/plan'},
        {id: 'progress', name: 'Progress', port: 8202, icon: '📈', method: 'tools/jira_velocity'},
        {id: 'risks', name: 'Risks', port: 8203, icon: '⚠️', method: 'tools/analyze_risks'},
        {id: 'digest', name: 'Digest', port: 8204, icon: '📄', method: 'tools/daily_digest'},
        {id: 'image', name: 'Image', port: 8205, icon: '🖼️', method: 'tools/analyze_local_file'},
        {id: 'health', name: 'Health', port: 8206, icon: '❤️', method: 'tools/check_health'},
        {id: 'metrics', name: 'Metrics', port: 8207, icon: '📊', method: 'tools/get_metrics'}
    ];

    // Theme Management
    function initTheme() {
        const themeToggle = document.getElementById('themeToggle');
        const themeLabel = document.getElementById('themeLabel');
        const savedTheme = localStorage.getItem('theme') || 'dark';

        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggle.checked = savedTheme === 'light';
        themeLabel.textContent = savedTheme.charAt(0).toUpperCase() + savedTheme.slice(1);

        themeToggle.addEventListener('change', () => {
            const newTheme = themeToggle.checked ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            themeLabel.textContent = newTheme.charAt(0).toUpperCase() + newTheme.slice(1);
            localStorage.setItem('theme', newTheme);
        });
    }

    // Initialize agents grid
    function initAgentsGrid() {
        const grid = document.getElementById('agentsGrid');
        grid.innerHTML = agents.map(agent => `
            <div class="agent-card" data-id="${agent.id}">
                <div class="agent-status"></div>
                <div class="agent-icon">${agent.icon}</div>
                <div class="agent-name">${agent.name}</div>
                <div class="agent-port">:${agent.port}</div>
            </div>
        `).join('');
    }

    // Add log entry
    function addLog(message, type = 'info') {
        const container = document.getElementById('outputContainer');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.textContent = message;
        container.appendChild(entry);
        container.scrollTop = container.scrollHeight;
    }

    // Clear logs
    function clearLogs() {
        document.getElementById('outputContainer').innerHTML = '';
    }

    // Update agent status
    function updateAgentStatus(agentId, status) {
        const card = document.querySelector(`[data-id="${agentId}"]`);
        if (card) {
            const statusDot = card.querySelector('.agent-status');
            statusDot.className = `agent-status ${status}`;
            
            card.classList.remove('working', 'active');
            if (status === 'working') {
                card.classList.add('working');
            } else if (status === 'success') {
                card.classList.add('active');
            }
        }
    }

    // Build request parameters based on agent type
    function buildParams(agentId, inputValue) {
        const params = {};
        
        switch(agentId) {
            case 'planner':
                params.description = inputValue || 'Implement OAuth2 authentication';
                break;
            case 'risks':
                params.feature = inputValue || 'OAuth2 implementation';
                break;
            case 'image':
    const fileName = inputValue?.trim();

    if (!fileName) {
        throw new Error(
            'For Image Agent, please specify a file name, e.g. workflow.png'
        );
    }

    params.file_path = `/app/assets/${fileName}`;
    params.context = `Image analysis for ${fileName}`;
    break;

            case 'health':
                params.agents = {
                    planner: 'http://planner:8201/health',
                    progress: 'http://progress:8202/health',
                    risks: 'http://risks:8203/health',
                    digest: 'http://digest:8204/health',
                    image: 'http://image:8205/health'
                };
                break;
            default:
                break;
        }
        
        return params;
    }

    // Execute agent
    async function executeAgent() {
        const select = document.getElementById('agentSelect');
        const input = document.getElementById('taskInput');
        const btn = document.getElementById('executeBtn');

        const selectedId = select.value;
        const agent = agents.find(a => a.id === selectedId);

        if (!agent) {
            addLog('❌ Agent not found', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> Processing...';
        clearLogs();
        addLog(`🚀 Executing ${agent.name} Agent on port ${agent.port}...`);
        updateAgentStatus(agent.id, 'working');

        try {
            const params = buildParams(agent.id, input.value);
            const url = `${API_BASE}:${agent.port}/mcp`;
            
            addLog(`📡 Sending request to ${url}...`);

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    method: agent.method,
                    params: params
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();

            addLog(`✅ ${agent.name} completed successfully`, 'success');
            updateAgentStatus(agent.id, 'success');

            displayResults(agent, data);

        } catch (error) {
            console.error('Agent execution error:', error);
            
            let errorMessage = error.message;
            
            if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                errorMessage = 'CORS Error: Cannot connect to agent. Make sure:\n' +
                              '1. Agent is running on the correct port\n' +
                              '2. CORS is enabled on the agent\n' +
                              '3. You\'re accessing from the correct origin';
                
                addCorsWarning();
            }
            
            addLog(`❌ Error: ${errorMessage}`, 'error');
            updateAgentStatus(agent.id, 'error');

        } finally {
            btn.disabled = false;
            btn.innerHTML = '⚡ Execute Agent';
        }
    }

    // Display results
    function displayResults(agent, data) {
        const container = document.getElementById('outputContainer');
        const resultCard = document.createElement('div');
        resultCard.className = 'result-card';
        
        let summary = '';
        if (data.subtasks) {
            summary = `<strong>Subtasks:</strong> ${data.subtasks.length}<br>`;
        }
        if (data.total_issues !== undefined) {
            summary = `<strong>Total Issues:</strong> ${data.total_issues}<br>`;
        }
        if (data.completion_rate !== undefined) {
            summary = `<strong>Completion Rate:</strong> ${data.completion_rate}%<br>`;
        }
        
        resultCard.innerHTML = `
            <h4>📦 Response from ${agent.name}</h4>
            ${summary ? `<div style="margin-bottom: 8px;">${summary}</div>` : ''}
            <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
        container.appendChild(resultCard);
    }

    // Add CORS warning
    function addCorsWarning() {
        const container = document.getElementById('outputContainer');
        const warning = document.createElement('div');
        warning.className = 'cors-warning';
        warning.innerHTML = `
            <strong>⚠️ CORS Configuration Required</strong><br>
            Add to your agent's FastAPI app:<br>
            <pre style="margin-top: 8px;">
from fastapi.middleware.cors import CORSMiddleware

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_methods=["*"],
    allow_headers=["*"],
)</pre>
        `;
        container.appendChild(warning);
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
        initTheme();
        initAgentsGrid();
        addLog('💡 System ready. Select an agent to begin.');
    });
</script>
</body>
</html>
