services:
  planner:
    build:
      context: .
      dockerfile: docker/Dockerfile.planner
    ports:
      - "8201:8201"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8201/health')\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  progress:
    build:
      context: .
      dockerfile: docker/Dockerfile.progress
    ports:
      - "8202:8202"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8202/health')\" || exit 1" ]
    networks:
      - agent-net
    dns:
      - 8.8.8.8

  risks:
    build:
      context: .
      dockerfile: docker/Dockerfile.risks
    ports:
      - "8203:8203"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8203/health')\" || exit 1" ]
    networks:
      - agent-net
    dns:
      - 8.8.8.8

  digest:
    build:
      context: .
      dockerfile: docker/Dockerfile.digest
    ports:
      - "8204:8204"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8204/health')\" || exit 1" ]
    networks:
      - agent-net
    dns:
      - 8.8.8.8

  image:
    build:
      context: .
      dockerfile: docker/Dockerfile.image
    ports:
      - "8205:8205"
    env_file:
      - .env

    volumes:
      - ./assets:/app/assets:ro

    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8205/health')\" || exit 1"
      ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    dns:
      - 8.8.8.8

  health_monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.health_monitor
    ports:
      - "8206:8206"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8206/health')\" || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    dns:
      - 8.8.8.8

  metrics_agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.metrics
    ports:
      - "8207:8207"
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8207/health')\" || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    dns:
      - 8.8.8.8


  static-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.static

    ports:
      - "8101:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/architecture.png"]
      interval: 10s
      timeout: 3s
      retries: 3
    dns:
      - 8.8.8.8

  n8n-training:
    image: n8nio/n8n
    container_name: training-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_training:/home/node/.n8n
    env_file:
      - .env
    networks:
      - agent-net


networks:
  agent-net:
    driver: bridge

volumes:
  n8n_training: